{% extends "base.html" %}
{% block title %}ユーザー追加 | 売上・顧客管理{% endblock %}
{% block content %}
  <h2>新規ユーザー追加</h2>
  {% if error %}<p class="flash flash-error">{{ error }}</p>{% endif %}
  <form method="post" class="data-form">
    <label>
      ユーザー名 <span class="required">必須</span>
      <input type="text" name="username" required value="{{ username }}">
    </label>
    <label>
      パスワード <span class="required">必須</span>
      <input type="password" name="password" required>
    </label>
    <label>
      パスワード(確認) <span class="required">必須</span>
      <input type="password" name="confirm_password" required>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" name="is_admin" {{ 'checked' if is_admin else '' }}>
      管理者権限を付与する
    </label>
    <div class="form-actions">
      <button type="submit" class="btn">追加する</button>
      <a href="{{ url_for('list_users') }}">キャンセル</a>
    </div>
  </form>
{% endblock %}
