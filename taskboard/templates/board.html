{% extends "base.html" %}

{% block title %}{{ board.name }} | あたまのなかタスクボード{% endblock %}

{% block content %}
<div class="board" id="board" data-board-id="{{ board.id }}">
  <div class="share-box">
    <label for="share-url">このボードを共有:</label>
    <input type="text" id="share-url" readonly value="{{ request.url }}">
    <button id="copy-url-btn" class="btn btn-small" type="button">リンクをコピー</button>
  </div>

  <div class="canvas-wrapper" id="canvas-wrapper">
    <div class="canvas" id="canvas">
      <svg class="connectors" id="connectors"></svg>
      <!-- notes are rendered here by board.js -->
    </div>
  </div>

  <button id="add-root-note-btn" class="fab" type="button" title="付箋を追加">+</button>
</div>

<template id="note-template">
  <div class="note" data-note-id="">
    <div class="note-text" contenteditable="true"></div>
    <div class="note-footer">
      <div class="color-dots">
        {% for c in colors %}
        <button class="dot dot-{{ c }}" data-color="{{ c }}" title="{{ c }}" type="button"></button>
        {% endfor %}
      </div>
      <div class="note-actions">
        <button class="icon-btn add-child-btn" title="サブタスクを追加" type="button">+</button>
        <button class="icon-btn delete-note-btn" title="削除" type="button">&times;</button>
      </div>
    </div>
  </div>
</template>

<script id="initial-notes" type="application/json">{{ notes | tojson }}</script>
<script src="{{ url_for('static', filename='board.js') }}"></script>
{% endblock %}
