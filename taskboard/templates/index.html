{% extends "base.html" %}

{% block content %}
<section class="intro">
  <h1>頭の中のタスクを、ボードに全部出そう</h1>
  <p>
    ホワイトボードのブレストみたいに、付箋を好きな場所に自由に貼れます。
    タスクからサブタスク、さらにその先へ、「+」で線をつなげながら枝分かれさせられます。
    色分けもできて、ボードはURLひとつで誰とでも共有できます。
  </p>
  <form action="{{ url_for('new_board') }}" method="post">
    <button type="submit" class="btn btn-large">新しいボードを作る</button>
  </form>
</section>
{% endblock %}
