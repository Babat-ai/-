name: Fetch reference site snapshot

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to snapshot"
        required: true
        default: "https://senseisha.co.jp/"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Snapshot page
        run: |
          mkdir -p reference-snapshots
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            await page.goto(process.env.TARGET_URL, { waitUntil: 'networkidle', timeout: 60000 });
            await page.screenshot({ path: 'reference-snapshots/snapshot.png', fullPage: true });
            const html = await page.content();
            require('fs').writeFileSync('reference-snapshots/snapshot.html', html);
            await browser.close();
          })();
          "
        env:
          TARGET_URL: ${{ github.event.inputs.url }}

      - name: Commit snapshot to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reference-snapshots
          git commit -m "Add site snapshot for ${{ github.event.inputs.url }}" || echo "Nothing to commit"
          git push
