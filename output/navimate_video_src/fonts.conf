<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias binding="same"><family>BIZ UDゴシック</family><prefer><family>BIZ UDGothic</family></prefer></alias>
  <alias binding="same"><family>BIZ UDPゴシック</family><prefer><family>BIZ UDPGothic</family></prefer></alias>
  <match target="pattern"><test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="append" binding="strong"><string>BIZ UDPGothic</string></edit></match>
  <alias><family>sans-serif</family><prefer><family>BIZ UDPGothic</family></prefer></alias>
</fontconfig>
